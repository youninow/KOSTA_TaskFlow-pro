<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-gray-100 dark:bg-gray-950 font-sans transition-colors duration-200">

  <!-- 헤더 -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-gray-900 dark:text-white tracking-tight">
        TaskFlow Pro
      </h1>
      <button
        id="theme-toggle"
        class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        aria-label="테마 전환"
      >
        <span id="theme-icon" class="text-xl">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- 태스크 추가 폼 (3-02) -->
    <section class="bg-white/70 dark:bg-gray-900/70 backdrop-blur-md rounded-xl shadow-lg p-5 border border-gray-200 dark:border-gray-800">
      <h2 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3">
        새 태스크
      </h2>
      <form id="add-form" class="space-y-3">
        <input
          id="new-title"
          type="text"
          placeholder="태스크 제목을 입력하세요"
          required
          maxlength="200"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
        />
        <div class="flex gap-2 flex-wrap">
          <input
            id="new-due-at"
            type="datetime-local"
            class="flex-1 min-w-[180px] px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
          />
          <select
            id="new-status"
            class="px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
          >
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
          <button
            type="submit"
            class="min-h-[44px] px-5 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white text-sm font-medium transition-colors shadow-sm"
          >
            + 추가
          </button>
        </div>
      </form>
    </section>

    <!-- 태스크 목록 (3-03) -->
    <section>
      <div
        id="task-list"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
      ></div>
      <div id="empty-state" class="hidden text-center py-16">
        <p class="text-5xl mb-4">📋</p>
        <p class="text-sm text-gray-400 dark:text-gray-600">
          아직 태스크가 없습니다. 위에서 추가해보세요.
        </p>
      </div>
    </section>

  </main>

  <!-- 수정 모달 (3-04) -->
  <div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-6 border border-gray-200 dark:border-gray-700">
      <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-4">태스크 수정</h2>
      <form id="edit-form" class="space-y-3">
        <input
          id="edit-title"
          type="text"
          placeholder="제목"
          required
          maxlength="200"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
        />
        <textarea
          id="edit-description"
          placeholder="설명 (선택)"
          rows="3"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm resize-none"
        ></textarea>
        <input
          id="edit-due-at"
          type="datetime-local"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
        />
        <select
          id="edit-status"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
        >
          <option value="todo">Todo</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <div class="flex gap-2 pt-1">
          <button
            type="button"
            id="cancel-edit"
            class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-sm font-medium"
          >
            취소
          </button>
          <button
            type="submit"
            class="flex-1 min-h-[44px] rounded-xl bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium transition-colors"
          >
            저장
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 삭제 확인 다이얼로그 (3-05) -->
  <div id="delete-dialog" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="delete-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-sm bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-6 border border-gray-200 dark:border-gray-700">
      <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-1">태스크 삭제</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-5">이 태스크를 삭제할까요? 되돌릴 수 없습니다.</p>
      <div class="flex gap-2">
        <button
          id="cancel-delete"
          class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-sm font-medium"
        >
          취소
        </button>
        <button
          id="confirm-delete"
          class="flex-1 min-h-[44px] rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
